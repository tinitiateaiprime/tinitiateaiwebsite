
name: Build and deploy Node.js app to Azure Web App - tinitiate-web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download website code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js website
        run: npm run build

      - name: Prepare production deployment
        run: |
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          cp -a public deploy/public
          npm pkg set 'scripts.start=node server.js' --prefix deploy
          test -f deploy/server.js
          test -d deploy/.next/static
          du -sh deploy

      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download production files
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EADD10B5AD49453B915B5B8AB3A60404 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_63DE8CD76A5E4615B7DD4F95B0C2A1B3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D782C6DD4A5C4C92A6841B0D75BCE4DB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'tinitiate-web'
          slot-name: 'Production'
          package: ./deploy
